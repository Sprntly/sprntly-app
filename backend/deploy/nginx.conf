# ---------------------------------------------------------------------------
# Response compression. NOTHING was compressed before this block: a measured
# first-load chunk shipped 201,285 B raw where gzip -9 gives 50,801 B (4.0x),
# against ~2.8 MB of first-load JS across 47 chunks. Brotli would be ~4.7x but
# `ngx_brotli` is not built into the box's nginx (only the standalone `brotli`
# package is available), so gzip is the ceiling here until the module is added.
#
# `gzip_static on` is a no-op today and deliberately so: it costs nothing, and
# the frontend is a Next STATIC EXPORT, so the build can later emit `.js.gz`
# alongside each chunk and nginx will serve those with zero per-request CPU.
# That is the follow-up; this block is the part that works without a build change.
#
# `gzip_proxied any` matters because the API responses are proxied from FastAPI
# (uncompressed PRD HTML, ticket lists, KG payloads) — without it nginx skips
# compressing anything carrying proxy response headers.
# ---------------------------------------------------------------------------
gzip              on;
gzip_static       on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml application/atom+xml
    image/svg+xml font/ttf font/otf;

# ---------------------------------------------------------------------------
# Access log format carrying TIMING. The stock `main` format in nginx.conf has
# neither $request_time nor $host, which is why no API p95 exists for any
# endpoint and why prod and staging traffic cannot be told apart in the access
# log (both are served by this same box and file).
#
#   $request_time          — full time nginx spent on the request
#   $upstream_response_time — time the FastAPI upstream took (blank for static)
#   $host                  — which vhost, i.e. prod vs staging
#
# Applied via `access_log ... timed;` INSIDE each server block below, not at
# http level: nginx.conf already sets an http-level `access_log ... main;`, and
# a second http-level directive ADDS a target rather than replacing it, which
# would write every line twice. A server-level directive overrides cleanly.
# ---------------------------------------------------------------------------
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" "$http_x_forwarded_for" '
                 'host=$host rt=$request_time urt=$upstream_response_time';

# ---------------------------------------------------------------------------
# SECURITY HEADERS (Workstreet black-box assessment 2026-09-02, WS-01/02/04)
#
# The assessment found NO security headers on any response from either
# app.sprntly.ai or api.sprntly.ai. Both are served by this file, so the fix
# lives here rather than in the FastAPI app or the Next export.
#
# Repeated per server block rather than declared once, because nginx has no
# http-level hook available to us: this file is dropped into conf.d, which is
# already inside the http block, and `add_header` does not accept a location
# outside server/location scope. The same repetition is why each
# `location` below that declares an `add_header` of its own ALSO repeats
# these three -- nginx replaces, never merges, the inherited set: a block with
# any add_header of its own inherits NONE from its parent. Adding a
# Cache-Control to a location and forgetting to re-add these is the way this
# silently regresses.
#
# `always` on every one: without it nginx only emits the header on
# 200/204/301/302/304, so error responses -- exactly the ones an attacker
# provokes -- would ship bare.
#
# HSTS carries includeSubDomains but NOT preload. Every hostname this file
# serves (api, app, demo, api.demo, staging, api.staging) terminates TLS
# above, so includeSubDomains is safe today; preload is a one-way door that
# should follow only after the header has been stable in prod for a while.
#
# NOT set here: Content-Security-Policy (WS-03). A `default-src 'self'` policy
# shipped blind breaks the Next static export, and a Report-Only policy with
# nowhere to send reports is decorative. CSP needs its own change: stand up a
# collector, gather real violations, then enforce.
# ---------------------------------------------------------------------------

# Port 80: serve Let's Encrypt HTTP-01 challenges in-place, otherwise
# redirect everything to HTTPS. Shared by every hostname we serve from
# this box (api / app / demo). certbot edits the matching 443 server
# block per-domain; the 80 block stays a generic redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api.sprntly.ai app.sprntly.ai demo.sprntly.ai api.demo.sprntly.ai
                api.staging.sprntly.ai staging.sprntly.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS termination. Cert is managed by certbot with authenticator=WEBROOT
# (see /etc/letsencrypt/renewal/api.sprntly.ai.conf). It was `nginx` until
# 2026-08-09, which does not compose with this deploy: deploy-backend.yml
# overwrites /etc/nginx/conf.d/sprintly.conf from this file on every deploy,
# so an authenticator that works by editing nginx config is fighting the
# pipeline. The webroot challenge is served by the port-80 block above.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sprntly.ai;

    access_log /var/log/nginx/access.log timed;

    ssl_certificate     /etc/letsencrypt/live/api.sprntly.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sprntly.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Baseline security headers — see SECURITY HEADERS note above for why these
    # are repeated per server block and marked `always`.
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Legacy /demo path → redirect to demo.sprntly.ai (preserves path).
    # The Next app is now built without basePath and served at the root
    # of demo.sprntly.ai (see server block below).
    location ~ ^/demo(/.*)?$ {
        return 301 https://demo.sprntly.ai$1$is_args$args;
    }
    # Legacy short URLs that historically redirected into the /demo app.
    location = /privacy { return 301 https://demo.sprntly.ai/privacy; }
    location = /terms   { return 301 https://demo.sprntly.ai/terms; }

    # DS-Agent chat UI (sprntly-agent.service on 127.0.0.1:8002).
    # Sits ahead of the catch-all `location /` so /agent/... never falls
    # through to the main backend. Larger client_max_body_size for CSV
    # uploads.
    location /agent/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 50m;
    }

    # Customer-facing MCP endpoint (sprntly-mcp.service on 127.0.0.1:8003).
    # Canonical public URL: https://api.sprntly.ai/mcp — riding the existing
    # api.sprntly.ai cert means zero DNS/certbot work on the box (a dedicated
    # mcp.sprntly.ai host would need both; see git history if we ever cut
    # over). Streamable HTTP transport — may respond with chunked/SSE-style
    # streaming bodies, so buffering must stay off. No trailing slash on
    # either side: the public path /mcp maps 1:1, unstripped, onto FastMCP's
    # default streamable_http_path (/mcp). Backend routes are all /v1/*, so
    # this prefix can't shadow them (/v1/mcp-tokens included).
    location /mcp {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 600s;
        # PRD uploads (PDF/PPT) can be a few MB; without this nginx caps at its
        # 1m default and rejects them with a 413 the browser sees as "failed to
        # fetch". Matches the /agent, /mcp, and api.demo blocks.
        client_max_body_size 50m;
    }
}

# demo.sprntly.ai — serves the static Next export at /var/www/sprntly-demo/.
# Replaces the legacy sprntly.ai/demo Vercel rewrite. Once this is live, the
# rewrite block can be removed from sprntlyai_website/vercel.json.
# Cert is a SAN covering both demo.sprntly.ai and app.sprntly.ai (issued
# together by certbot; lives under live/demo.sprntly.ai/).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.sprntly.ai;

    ssl_certificate     /etc/letsencrypt/live/demo.sprntly.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.sprntly.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Baseline security headers — see SECURITY HEADERS note above for why these
    # are repeated per server block and marked `always`.
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/sprntly-demo;
    try_files $uri $uri/ $uri.html /index.html;

    access_log /var/log/nginx/access.log timed;

    # Content-hashed build output: cache it forever. Next embeds a content hash
    # in every /_next/static/ filename, so a changed file is a changed URL and
    # this can never serve stale code. Without it these carry only etag +
    # last-modified, so the browser REVALIDATES all ~50-98 chunks on every
    # navigation -- a full round-trip each, visible as a wall of 304s in the
    # access log. `^~` so it is chosen over the regex locations below without
    # them being evaluated.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeated, not inherited: nginx drops ALL inherited add_header
        # directives in any block that declares one of its own.
        add_header X-Content-Type-Options   "nosniff"                          always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

}

# app.sprntly.ai — production Sprntly app (Sprntly/sprntly-app repo).
# Static Next export rsynced to /var/www/sprntly-app/ by the
# deploy-frontend.yml workflow in sprntly-app.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.sprntly.ai;

    ssl_certificate     /etc/letsencrypt/live/demo.sprntly.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.sprntly.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Baseline security headers — see SECURITY HEADERS note above for why these
    # are repeated per server block and marked `always`.
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/sprntly-app;
    try_files $uri $uri/ $uri.html /index.html;

    access_log /var/log/nginx/access.log timed;

    # Content-hashed build output: cache it forever. Next embeds a content hash
    # in every /_next/static/ filename, so a changed file is a changed URL and
    # this can never serve stale code. Without it these carry only etag +
    # last-modified, so the browser REVALIDATES all ~50-98 chunks on every
    # navigation -- a full round-trip each, visible as a wall of 304s in the
    # access log. `^~` so it is chosen over the regex locations below without
    # them being evaluated.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeated, not inherited: nginx drops ALL inherited add_header
        # directives in any block that declares one of its own.
        add_header X-Content-Type-Options   "nosniff"                          always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # Design-Agent bundle proxy (Option B / Decision 2 — same-origin serving).
    # `^~` prefix: as the longest match it short-circuits BEFORE the regex `/p/`
    # locations below, so /_da-bundle/* reaches FastAPI while everything else keeps
    # serving the static export via try_files. The trailing slash on proxy_pass
    # strips the prefix: /_da-bundle/v1/design-agent/<...> -> /v1/design-agent/<...>
    # (same FastAPI process api.sprntly.ai proxies to). Keep this target and the
    # bundle_url base baked into the prototype row in lockstep. Full curl-verify
    # recipe + path-rewrite caveat: backend/deploy/da-bundle-proxy.nginx.conf.
    location ^~ /_da-bundle/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Forward grant cookies (da_view_grant / da_share_grant); let Set-Cookie
        # pass back unmodified so it stays first-party to app.sprntly.ai.
        proxy_set_header Cookie            $http_cookie;
        proxy_pass_header Set-Cookie;

        # Stream + Range safety (mirrors the api block's proxy_buffering off):
        # FastAPI StreamingResponse / 206 Range responses flow through unbuffered.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      600s;

        # Do NOT add a rewrite that drops the query string (the ?v=<nonce>
        # cache-buster) or normalizes the asset subpath — nested assets/... must
        # reach FastAPI intact; its traversal guard rejects anything unsafe.
    }
    # Design-agent runtime-dynamic routes (1B): serve the exported client
    # shell for any token/id; the client reads the real id from the URL.
    # /p/<company>/<feature>/<token> (canonical, 3-seg), /p/<slug>/<token>
    # (canonical, 2-seg) and /p/<token> (legacy redirect, 1-seg) → SPA shell.
    # Static export emits /p/_/_/_.html (3-seg), /p/_/_.html (2-seg) and
    # /p/_.html (1-seg) sentinels. Regex `~` (NOT `^~`) — a `^~` prefix match
    # would short-circuit before regex evaluation. The three regexes are
    # mutually exclusive by segment count (`[^/]+` cannot match `/`), so order
    # does not affect correctness; listed longest-first for readability.
    location ~ ^/p/[^/]+/[^/]+/[^/]+/?$ { try_files /p/_/_/_.html =404; }
    location ~ ^/p/[^/]+/[^/]+/?$       { try_files /p/_/_.html   =404; }
    location ~ ^/p/[^/]+/?$             { try_files /p/_.html     =404; }
    # Shared-report viewer (/r/<token>) — same runtime-dynamic pattern as /p:
    # static export emits the /r/_.html sentinel and the client reads the real
    # token from the URL. One segment only, so one regex.
    location ~ ^/r/[^/]+/?$             { try_files /r/_.html     =404; }
    location ^~ /design/ { try_files /design/_.html =404; }
}

# api.demo.sprntly.ai — demo's own backend (sprintly-demo.service on
# 127.0.0.1:8001). Independent FastAPI process from sprintly.service
# (api.sprntly.ai → 8000); own SQLite DB at /var/lib/sprntly-demo/data/
# and own JWT secret. Source-of-truth code lives in Sprntly/sprntly-demo
# and is checked out at ~/Sprntly-demo on the box.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.demo.sprntly.ai;

    ssl_certificate     /etc/letsencrypt/live/demo.sprntly.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.sprntly.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Baseline security headers — see SECURITY HEADERS note above for why these
    # are repeated per server block and marked `always`.
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 50m;
    }
}

