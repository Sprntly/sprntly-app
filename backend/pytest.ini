[pytest]
testpaths = tests
addopts = -q --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    # Background async warming tasks may outlive their test's tmp DB; harmless.
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    integration: tests that hit the real network or filesystem more than tmp_path
    real_build: spawns a real `npx vite`/`npx tsc` subprocess (CPU-heavy). CI runs
        these in a dedicated SEQUENTIAL step (-m real_build) isolated from the rest
        of the suite so the 2-vCPU runner never starves the build → no SIGKILL
        flake. The main integration step runs -m "not real_build". Both on every PR.
    real_template_compile: opts OUT of conftest's `_no_background_template_compile`
        guard, which no-ops artifact-template format checks everywhere else. Only
        the compile suite wants the real `schedule_compile`, and it stubs the
        gateway itself. The guard exists because `fake_llm` patches
        `app.llm.call_json`, which does NOT reach `graph.gateway`'s own binding —
        so an unguarded background compile would make a real Anthropic call. NOT a
        network marker: tests carrying it still hit nothing.
    real_referent_adjudication: opts OUT of conftest's `_no_referent_adjudication`
        guard, which returns "no referent" from `document_referent.adjudicate`
        everywhere else. Same hazard and same reasoning as the marker above: the
        adjudication call reaches `graph.gateway.llm_call` directly, so any ask
        test whose question happens to carry a document cue would otherwise make
        a real Anthropic call. Also NOT a network marker.
